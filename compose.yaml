name: forever-hotel-wkms

services:
  backend:
    profiles:
      - integration
    image: forever-hotel-wkms-backend:ddp218
    build:
      context: ./backend
    env_file:
      - ./backend/.env.docker.local
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped

  frontend:
    image: forever-hotel-wkms-frontend:ddp218
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: "http://localhost:8080"
        NEXT_PUBLIC_WKMS_SOCKET_URL: "http://localhost:3000"
    ports:
      - "127.0.0.1:3001:3001"
    init: true
    restart: unless-stopped